# 1. KẾT NỐI DATABASE MYSQL CỦA BOSS
spring.datasource.url=jdbc:mysql://localhost:3306/hethongquanlydiem?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. CẤU HÌNH CHO XÀI HÀM CỦA SPRING DATA JPA (Tự động sinh câu lệnh SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dùng ĐÚNG tên cột từ @Column(name=...) — không tự chuyển camelCase → snake_case
# DiemCongXetTuyen giữ tên gốc: diemCC, diemUtxt, diemTong
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3. CHỈ ĐƯỜNG CHO ANH PHỤC VỤ (CONTROLLER) TÌM ĐẾN BÀN ĂN (JSP)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 4. TẮT CACHE STATIC ĐỂ CSS CẬP NHẬT NGAY KHI DEV
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true